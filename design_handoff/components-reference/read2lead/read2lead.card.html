<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .bars { display: grid; gap: 10px; max-width: 360px; margin-bottom: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { RankBadge, ProgressBar, TopicTile } = window.FelixCoachingDesignSystem_05c199;
  function Demo() {
    return (
      <div>
        <div className="row">
          <RankBadge tier="bronze" />
          <RankBadge tier="silver" />
          <RankBadge tier="gold" level={7} />
          <RankBadge tier="diamond" />
          <RankBadge tier="legend" />
        </div>
        <div className="bars">
          <ProgressBar value={65} />
          <ProgressBar gradient value={72} />
        </div>
        <div className="tiles">
          <TopicTile emoji="🐾" label="Động vật" selected />
          <TopicTile emoji="⚽" label="Thể thao" />
          <TopicTile emoji="🎮" label="Trò chơi" />
          <TopicTile emoji="🍳" label="Nấu ăn" />
          <TopicTile emoji="✨" label="Phép màu" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
