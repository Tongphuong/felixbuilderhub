        <button style="min-height:46px;border-radius:999px;border:2px solid rgba(232,217,184,0.35);background:transparent;color:#e8d9b8;font:600 15px Inter,sans-serif;padding:10px 20px;cursor:pointer;opacity:0.55">🔊 Nghe lại câu</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;skyTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bright&quot;,&quot;deep&quot;],&quot;default&quot;:&quot;bright&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bầu trời đêm&quot;},&quot;goldTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;brand&quot;],&quot;default&quot;:&quot;brand&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bầu trời đêm&quot;},&quot;starrySky&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Bầu trời đêm&quot;}}">
class Component extends DCLogic {
  applyTheme() {
    var sky = this.props.skyTone ?? 'bright';
    var gold = this.props.goldTone ?? 'light';
    var t = sky === 'bright' ? {
      backdrop: '#0b1c30', frame: '#143050', tile: '#1b3a57',
      stripeA: '#1d4062', stripeB: '#183654', pill: 'rgba(35,72,102,0.8)', onGold: '#1b3a57'
    } : {
      backdrop: '#060d14', frame: '#0a1622', tile: '#122c42',
      stripeA: '#16324a', stripeB: '#122a3f', pill: 'rgba(23,53,74,0.7)', onGold: '#132c42'
    };
    var g = gold === 'light' ? { hi: '#ffe6a6', lo: '#eab95e' } : { hi: '#f2cc7e', lo: '#c88f38' };
    var r = document.documentElement.style;
    r.setProperty('--shd-backdrop', t.backdrop);
    r.setProperty('--shd-frame', t.frame);
    r.setProperty('--shd-tile', t.tile);
    r.setProperty('--shd-stripe-a', t.stripeA);
    r.setProperty('--shd-stripe-b', t.stripeB);
    r.setProperty('--shd-pill', t.pill);
    r.setProperty('--shd-on-gold', t.onGold);
    r.setProperty('--shd-gold-hi', g.hi);
    r.setProperty('--shd-gold-lo', g.lo);
  }
  componentDidMount() { this.applyTheme(); }
  componentDidUpdate() { this.applyTheme(); }
  renderVals() {
    return { starsOn: this.props.starrySky ?? true };
  }
}
</script>
