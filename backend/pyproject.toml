[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["generated", "logs", ".venv", "audio/stories"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
