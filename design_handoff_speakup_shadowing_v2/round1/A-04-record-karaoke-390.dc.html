<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A·04 Record + Karaoke — Night Arcade</title>
<style>
  /* ============ Direction A — NIGHT ARCADE (on-brand navy/gold/cream) ============ */
  :root{
    --night:#0a1b2b; --navy-950:#10273a; --navy-900:#17354a; --navy-850:#1d3f58; --navy-800:#244a64;
    --gold:#c88f38; --gold-light:#f2cc7e; --gold-hot:#ffe9a8;
    --cream:#f5e6c8; --cream-muted:#d9c7a4; --cream-dim:#aa9673;
    --ember:#ef9b4a; --rec:#ff6b5e;
    --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#06121f;font-family:var(--font);display:flex;flex-direction:column;align-items:center;padding:28px 0 60px;color:#8fa6b8}

  /* ---------- phone frame (board chrome, outside the artwork) ---------- */
  .phone{width:390px;border-radius:34px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);flex:none}

  /* ---------- THE SCREEN (1:1 artwork) ---------- */
  .screen{
    width:390px;min-height:820px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 55% at 50% 108%, rgba(200,143,56,.28), transparent 60%),
      radial-gradient(90% 40% at 50% -10%, #1d3f58, transparent 70%),
      linear-gradient(180deg,#0e2436 0%, #0a1b2b 55%, #081724 100%);
    display:flex;flex-direction:column;padding:18px 16px 26px;gap:14px;
  }
  /* starfield — tiny, quiet */
  .screen::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 40px 90px, rgba(245,230,200,.5), transparent 60%),
      radial-gradient(1px 1px at 330px 60px, rgba(245,230,200,.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 250px 130px, rgba(242,204,126,.45), transparent 60%),
      radial-gradient(1px 1px at 120px 40px, rgba(245,230,200,.35), transparent 60%),
      radial-gradient(1px 1px at 300px 200px, rgba(245,230,200,.25), transparent 60%),
      radial-gradient(1.5px 1.5px at 70px 220px, rgba(242,204,126,.3), transparent 60%);
  }

  /* ---------- counters ---------- */
  .hud{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
  .counter{display:flex;align-items:center;gap:7px;background:rgba(23,53,74,.85);
    border:2px solid rgba(242,204,126,.35);border-radius:999px;padding:8px 16px 8px 12px;
    font-weight:800;font-size:19px;color:var(--gold-light);
    box-shadow:0 0 18px rgba(242,204,126,.15), inset 0 1px 0 rgba(245,230,200,.12);}
  .counter .em{font-size:20px;filter:drop-shadow(0 0 6px rgba(242,204,126,.8))}

  /* ---------- paused cartoon frame ---------- */
  .player{position:relative;z-index:2;border-radius:20px;overflow:hidden;aspect-ratio:16/9;
    border:3px solid rgba(242,204,126,.4);
    box-shadow:0 14px 34px -12px rgba(0,0,0,.7), 0 0 24px rgba(242,204,126,.12);}
  .toon{position:absolute;inset:0;background:linear-gradient(180deg,#8fd3ff 0%,#c6ecff 52%,#ffe9b0 68%,#ffd98c 74%,#7ac96f 74%,#5cb85f 100%)}
  .toon .sun{position:absolute;top:14px;right:26px;width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff3c4, #ffd166 70%);box-shadow:0 0 28px 8px rgba(255,209,102,.55)}
  .toon .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95}
  .toon .c1{top:26px;left:34px;width:74px;height:22px}
  .toon .c1::before{content:"";position:absolute;left:16px;top:-12px;width:34px;height:26px;border-radius:999px;background:#fff}
  .toon .c2{top:52px;left:150px;width:52px;height:16px;opacity:.8}
  .toon .hill{position:absolute;bottom:-26px;border-radius:50%}
  .toon .h1{left:-60px;width:260px;height:110px;background:#69c26a}
  .toon .h2{right:-70px;width:280px;height:96px;background:#55b158}
  .toon .mat{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:156px;height:16px;
    border-radius:8px;background:#c99a5b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
  .toon .cat{position:absolute;bottom:28px;left:50%;margin-left:-26px;width:74px;height:32px;
    background:#f59e42;border-radius:16px 20px 14px 14px}
  .toon .cat::before{content:"";position:absolute;left:-22px;bottom:-2px;width:34px;height:32px;background:#f59e42;border-radius:50%}
  .toon .cat .ear{position:absolute;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #f59e42}
  .toon .cat .e1{left:-20px;top:-9px}
  .toon .cat .e2{left:-5px;top:-9px}
  .toon .cat .eye{position:absolute;left:-15px;bottom:13px;width:11px;height:6px;
    border-bottom:2.5px solid #7a4a12;border-radius:50%}
  .toon .cat .tail{position:absolute;right:-17px;bottom:5px;width:26px;height:9px;background:#f59e42;
    border-radius:8px;transform:rotate(-40deg)}
  .toon .zzz{position:absolute;bottom:76px;left:50%;margin-left:-64px;color:#fff;font-weight:800;
    font-size:13px;letter-spacing:3px;opacity:.95;transform:rotate(-12deg)}
  .veil{position:absolute;inset:0;background:rgba(10,27,43,.32)}
  .pausebadge{position:absolute;left:12px;bottom:10px;width:34px;height:34px;border-radius:12px;
    background:rgba(10,27,43,.75);display:flex;align-items:center;justify-content:center;gap:4px}
  .pausebadge i{width:5px;height:14px;border-radius:2px;background:var(--cream)}

  /* ---------- prompt ---------- */
  .prompt{position:relative;z-index:2;text-align:center;color:var(--cream);font-weight:800;font-size:21px;letter-spacing:.01em}
  .prompt .spark{color:var(--gold-light);font-size:15px;vertical-align:6px;margin:0 6px;
    text-shadow:0 0 10px rgba(242,204,126,.9)}

  /* ---------- marquee sentence (the signature) ---------- */
  .words{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:4px 2px}
  .word{font-weight:800;font-size:23px;padding:12px 16px;border-radius:16px;line-height:1;letter-spacing:.01em}
  .word.lit{ /* exact — bulb fully on */
    background:linear-gradient(180deg,var(--gold-hot),var(--gold-light) 55%,var(--gold));
    color:#10273a;border:2px solid #ffe9a8;transform:translateY(-3px);
    box-shadow:0 0 22px rgba(255,233,168,.65), 0 0 46px rgba(242,204,126,.35), 0 6px 14px -6px rgba(0,0,0,.6);
    animation:bulb 2.4s ease-in-out infinite;}
  .word.warm{ /* close — bulb warming up */
    background:rgba(239,155,74,.16);color:var(--ember);border:2px solid rgba(239,155,74,.75);
    box-shadow:0 0 14px rgba(239,155,74,.28), inset 0 0 12px rgba(239,155,74,.12);}
  .word.off{ /* pending — bulb off */
    background:#152f44;color:rgba(217,199,164,.6);border:2px solid rgba(170,150,115,.22);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.35);}
  @keyframes bulb{0%,100%{box-shadow:0 0 22px rgba(255,233,168,.65),0 0 46px rgba(242,204,126,.35),0 6px 14px -6px rgba(0,0,0,.6)}
    50%{box-shadow:0 0 30px rgba(255,233,168,.9),0 0 60px rgba(242,204,126,.5),0 6px 14px -6px rgba(0,0,0,.6)}}

  /* ---------- mic stage ---------- */
  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:2px;flex:1;justify-content:center}
  .micwrap{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center}
  .ring{position:absolute;border-radius:50%;border:3px solid rgba(242,204,126,.5);inset:0;animation:pulse 1.8s ease-out infinite}
  .ring.r2{animation-delay:.6s}
  .ring.r3{animation-delay:1.2s}
  @keyframes pulse{0%{transform:scale(.62);opacity:.9}100%{transform:scale(1.08);opacity:0}}
  .mic{
    width:112px;height:112px;border-radius:50%;border:none;cursor:pointer;position:relative;
    background:radial-gradient(circle at 50% 32%, #ff8d7e, var(--rec) 62%, #d94b3f 100%);
    box-shadow:0 0 0 8px rgba(242,204,126,.9), 0 0 0 12px rgba(242,204,126,.25),
               0 0 40px rgba(255,107,94,.55), 0 16px 30px -10px rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;
    animation:breathe 1.8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .mic svg{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .recdot{position:absolute;top:10px;right:14px;width:12px;height:12px;border-radius:50%;background:#fff;
    animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.25}}
  .miccap{color:var(--cream-muted);font-weight:700;font-size:16.5px;text-align:center}

  /* ---------- replay ---------- */
  .replay{position:relative;z-index:2;align-self:center;display:inline-flex;align-items:center;gap:9px;
    background:rgba(23,53,74,.9);border:2px solid rgba(242,204,126,.45);color:var(--gold-light);
    font-family:var(--font);font-weight:800;font-size:16.5px;border-radius:999px;padding:13px 24px;cursor:pointer;min-height:48px}
  .replay .ic{font-size:18px}

  /* ---------- board notes (OUTSIDE the artwork) ---------- */
  .note{width:390px;margin-top:22px;font-size:13.5px;line-height:1.6}
  .note b{color:#c9d8e4}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:4px;display:inline-block}

  @media (prefers-reduced-motion: reduce){
    .ring{display:none}
    .mic,.word.lit,.recdot{animation:none}
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <div class="hud">
      <div class="counter" id="shd-stars"><span class="em">⭐</span> 8</div>
      <div class="counter" id="shd-streak"><span class="em">🔥</span> 3</div>
    </div>

    <div class="player" id="shd-player-host">
      <div class="toon">
        <div class="sun"></div>
        <div class="cloud c1"></div><div class="cloud c2"></div>
        <div class="hill h1"></div><div class="hill h2"></div>
        <div class="mat"></div>
        <div class="cat"><i class="ear e1"></i><i class="ear e2"></i><span class="eye"></span><span class="tail"></span></div>
        <span class="zzz">z z</span>
      </div>
      <div class="veil"></div>
      <div class="pausebadge"><i></i><i></i></div>
    </div>

    <p class="prompt"><span class="spark">✦</span>Bây giờ đến lượt con nói!<span class="spark">✦</span></p>

    <div class="words" id="shd-words">
      <span class="word lit">The</span>
      <span class="word lit">cat</span>
      <span class="word warm">is</span>
      <span class="word off">sleeping</span>
      <span class="word off">on</span>
      <span class="word off">the</span>
      <span class="word off">mat</span>
    </div>

    <div class="stage">
      <div class="micwrap">
        <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
        <button class="mic" id="shd-mic-btn" aria-label="Đang ghi âm">
          <span class="recdot"></span>
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
        </button>
      </div>
      <p class="miccap">Đang ghi âm… nói cả câu nhé!</p>
    </div>

    <button class="replay" id="shd-replay-btn"><span class="ic">↻</span> Nghe lại câu</button>

  </div>
</div>

<div class="note">
  <b>A·04 — Đêm sân khấu (Night Arcade).</b> Câu nói là một bảng đèn marquee: từng chữ bật sáng khi bé nói đúng.
  <div class="legend">
    <span><i class="dot" style="background:#f2cc7e;box-shadow:0 0 8px #f2cc7e"></i> sáng = nói đúng</span>
    <span><i class="dot" style="background:rgba(239,155,74,.7)"></i> ấm = gần đúng</span>
    <span><i class="dot" style="background:#152f44;border:1px solid #44607a"></i> tắt = chưa nói tới</span>
  </div>
</div>

</body>
</html>
