<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 Question — Đêm sân khấu</title>
<style>
  :root{
    --night:#0a1b2b; --navy-900:#17354a; --navy-850:#1d3f58;
    --gold:#c88f38; --gold-light:#f2cc7e; --gold-hot:#ffe9a8;
    --cream:#f5e6c8; --cream-muted:#d9c7a4; --cream-dim:#aa9673;
    --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#06121f;font-family:var(--font);display:flex;flex-direction:column;align-items:center;padding:28px 0 60px;color:#8fa6b8}
  .phone{width:390px;border-radius:34px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);flex:none}
  .screen{width:390px;min-height:690px;position:relative;overflow:hidden;
    background:
      radial-gradient(130% 60% at 50% 20%, rgba(242,204,126,.12), transparent 60%),
      radial-gradient(120% 55% at 50% 108%, rgba(200,143,56,.24), transparent 60%),
      linear-gradient(180deg,#0e2436 0%, #0a1b2b 55%, #081724 100%);
    display:flex;flex-direction:column;padding:18px 16px 26px;gap:16px}
  .screen::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 44px 110px, rgba(245,230,200,.5), transparent 60%),
      radial-gradient(1px 1px at 330px 80px, rgba(245,230,200,.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 260px 50px, rgba(242,204,126,.45), transparent 60%),
      radial-gradient(1px 1px at 90px 380px, rgba(245,230,200,.3), transparent 60%)}

  .hud{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
  .counter{display:flex;align-items:center;gap:7px;background:rgba(23,53,74,.85);
    border:2px solid rgba(242,204,126,.35);border-radius:999px;padding:8px 16px 8px 12px;
    font-weight:800;font-size:19px;color:var(--gold-light);
    box-shadow:0 0 18px rgba(242,204,126,.15), inset 0 1px 0 rgba(245,230,200,.12)}
  .counter .em{font-size:20px;filter:drop-shadow(0 0 6px rgba(242,204,126,.8))}

  /* ---------- Minny asks, under the spotlight ---------- */
  .ask{position:relative;z-index:2;display:flex;align-items:flex-end;gap:12px;margin-top:10px}
  .minny{width:92px;height:92px;border-radius:50%;overflow:hidden;flex:none;
    border:4px solid var(--gold-light);box-shadow:0 0 24px rgba(242,204,126,.45);
    animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .minny img{width:100%;height:190%;object-fit:cover;transform:translateY(-27%)}
  .bubble{position:relative;background:rgba(23,53,74,.95);border:2.5px solid rgba(242,204,126,.5);
    border-radius:20px 20px 20px 6px;padding:16px 18px;color:var(--cream);
    font-weight:800;font-size:21px;line-height:1.35;
    box-shadow:0 10px 26px -10px rgba(0,0,0,.7), 0 0 20px rgba(242,204,126,.12)}
  .bubble::after{content:"";position:absolute;left:-11px;bottom:14px;
    border-top:9px solid transparent;border-bottom:9px solid transparent;
    border-right:11px solid rgba(242,204,126,.5)}

  /* ---------- answer tickets ---------- */
  .tickets{position:relative;z-index:2;display:flex;flex-direction:column;gap:15px;margin-top:14px;flex:1;justify-content:center}
  .ticket{position:relative;display:flex;align-items:center;gap:12px;
    background:rgba(23,53,74,.9);border:2.5px solid rgba(170,150,115,.3);
    border-radius:18px;padding:18px 20px 18px 24px;min-height:64px;cursor:pointer}
  /* ticket notches */
  .ticket::before,.ticket::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;
    background:#0a1c2d;top:50%;margin-top:-9px}
  .ticket::before{left:-11px;border-right:2.5px solid rgba(170,150,115,.3)}
  .ticket::after{right:-11px;border-left:2.5px solid rgba(170,150,115,.3)}
  .ticket .txt{font-weight:800;font-size:21px;color:var(--cream-muted);flex:1}
  .ticket .stub{width:34px;height:34px;border-radius:50%;flex:none;border:2.5px dashed rgba(170,150,115,.4)}

  .ticket.win{background:linear-gradient(180deg,rgba(255,233,168,.2),rgba(242,204,126,.12));
    border-color:var(--gold-hot);transform:scale(1.03);
    box-shadow:0 0 26px rgba(255,233,168,.4), 0 0 54px rgba(242,204,126,.2);
    animation:winpulse 2s ease-in-out infinite}
  @keyframes winpulse{0%,100%{box-shadow:0 0 26px rgba(255,233,168,.4),0 0 54px rgba(242,204,126,.2)}
    50%{box-shadow:0 0 36px rgba(255,233,168,.65),0 0 70px rgba(242,204,126,.32)}}
  .ticket.win::before{border-right-color:var(--gold-hot)}
  .ticket.win::after{border-left-color:var(--gold-hot)}
  .ticket.win .txt{color:var(--gold-hot)}
  .ticket.win .stub{border:none;background:linear-gradient(180deg,var(--gold-hot),var(--gold-light));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px rgba(255,233,168,.7)}
  .ticket.win .stub svg{width:20px;height:20px}
  /* tiny star burst on the winning ticket */
  .ticket.win .burst{position:absolute;top:-13px;right:16px;color:var(--gold-hot);font-size:18px;
    text-shadow:0 0 12px rgba(255,233,168,.95);animation:tw 1.8s ease-in-out infinite}
  .ticket.win .burst.b2{right:44px;top:-9px;font-size:12px;animation-delay:.5s}
  @keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

  .note{width:390px;margin-top:22px;font-size:13.5px;line-height:1.6}
  .note b{color:#c9d8e4}

  @media (prefers-reduced-motion: reduce){
    .minny,.ticket.win,.ticket.win .burst{animation:none}
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <div class="hud">
      <div class="counter" id="shd-stars"><span class="em">⭐</span> 8</div>
      <div class="counter" id="shd-streak"><span class="em">🔥</span> 3</div>
    </div>

    <div class="ask">
      <div class="minny"><img src="../../public/assets/minny/minny_idle.png" alt="Minny hỏi con"></div>
      <div class="bubble">Chú mèo đang làm gì?</div>
    </div>

    <div class="tickets" id="shd-question-card">
      <button class="ticket win">
        <span class="burst">✦</span><span class="burst b2">✦</span>
        <span class="txt">Đang ngủ 😴</span>
        <span class="stub"><svg viewBox="0 0 24 24" fill="none" stroke="#10273a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></span>
      </button>
      <button class="ticket">
        <span class="txt">Đang ăn 🍎</span>
        <span class="stub"></span>
      </button>
      <button class="ticket">
        <span class="txt">Đang chạy 🏃</span>
        <span class="stub"></span>
      </button>
    </div>

  </div>
</div>

<div class="note">
  <b>03 — Câu hỏi nhanh.</b> Minny hỏi bằng bong bóng thoại; ba tấm VÉ lớn là ba đáp án (mỗi vé cao hơn 64px,
  dễ chạm). Vé đúng vừa được chọn: bừng sáng vàng, đóng dấu ✓ vào cuống vé, sao nhỏ lấp lánh quanh mép.
</div>

</body>
</html>
