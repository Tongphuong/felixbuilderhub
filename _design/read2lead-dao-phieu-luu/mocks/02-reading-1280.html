<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đọc sách — 1280</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../design-system/r2l.css">
</head>
<body>



<style>body{margin:0}a{color:#17324D}a:hover{color:#0B1E30}</style>

<div class="r2l" style="width: 1280px; min-height: 820px; background: #9BDDFF; padding: 24px 40px">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 20px">
      <a href="#" class="back"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6" stroke="#17324D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Về nhà</a>
      <span class="d t-3" lang="en">The Sky Is Blue!</span>
      <div style="flex: 1; display: flex; gap: 6px; max-width: 420px; margin-left: auto">
        <span style="flex: 1; height: 14px; border-radius: 7px; background: #237A41; border: 2px solid #17324D"></span><span style="flex: 1; height: 14px; border-radius: 7px; background: #237A41; border: 2px solid #17324D"></span><span style="flex: 1; height: 14px; border-radius: 7px; background: #FFC83D; border: 2px solid #17324D"></span><span style="flex: 1; height: 14px; border-radius: 7px; background: #FFF8E7; border: 2px solid #17324D"></span><span style="flex: 1; height: 14px; border-radius: 7px; background: #FFF8E7; border: 2px solid #17324D"></span><span style="flex: 1; height: 14px; border-radius: 7px; background: #FFF8E7; border: 2px solid #17324D"></span>
      </div>
      <b style="font-size: 18px">Trang 3 / 6</b>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start">
      <div style="height: 640px; border: 3px solid #17324D; border-radius: 32px; overflow: hidden; background: #6CC7F5; box-shadow: 0 8px 0 #17324D">
        <svg role="img" aria-label="Tranh: bầu trời xanh, một chú chim nhỏ bay lên" width="100%" height="640" viewBox="0 0 352 400" preserveAspectRatio="xMidYMid slice"><circle cx="280" cy="80" r="40" fill="#FFD95A"></circle><g class="m-drift"><ellipse cx="80" cy="90" rx="50" ry="18" fill="#fff"></ellipse><ellipse cx="106" cy="76" rx="30" ry="20" fill="#fff"></ellipse></g><g class="m-bob"><path d="M150 170 q16 -18 32 0 q16 -18 32 0" stroke="#17324D" stroke-width="5" fill="none" stroke-linecap="round"></path><circle cx="182" cy="174" r="10" fill="#FF7A3D" stroke="#17324D" stroke-width="3"></circle></g><path d="M0 320 C70 290 150 312 230 298 C290 288 330 298 352 294 L352 400 L0 400Z" fill="#4FB868"></path><path d="M40 330 l14 -46 14 46z" fill="#237A41" stroke="#17324D" stroke-width="3"></path><path d="M286 336 l12 -36 12 36z" fill="#237A41" stroke="#17324D" stroke-width="3"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div class="card" style="position: relative; padding: 26px">
          <p lang="en" style="margin: 0; font-weight: 800; font-size: 32px; line-height: 1.5">The sky is <span style="background: #FFE7A8; border-radius: 6px; padding: 0 4px">blue</span>. A little bird flies up, up, up!</p>
          <img src="../assets/monsters-mock/mon-happy.png" alt="" style="position: absolute; right: -10px; bottom: -26px; width: 80px; height: 80px">
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <button class="btn btn-sm" style="font-size: 20px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#E0362C" stroke="#17324D" stroke-width="2"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8" stroke="#17324D" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>Con nói</button>
          <button class="btn btn-sm" style="font-size: 20px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3CC8F0" stroke="#17324D" stroke-width="2" stroke-linejoin="round"></path><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="#17324D" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>Nghe Minny đọc lại</button>
        </div>
        <div class="card-f" style="display: flex; flex-direction: column; gap: 10px; border-radius: 26px">
          <div style="display: flex; align-items: center; gap: 12px"><img src="../assets/minny/minny-face.svg" alt="Minny" style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #E0362C; object-fit: cover"><div style="display: flex; flex-direction: column"><span class="lab">Minny hỏi · chọn 1 nhé</span><span lang="en" class="d t-3">What colour is the sky?</span></div></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <button class="opt opt-ok"><span class="node n-done" style="width: 40px; height: 40px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span lang="en" style="flex: 1">Blue</span></button>
            <button class="opt"><span class="node" style="width: 40px; height: 40px; background: #FFF8E7; font-family: 'Baloo 2'; font-size: 20px">B</span><span lang="en">Green</span></button>
          </div>
          <span class="m-pop" style="font-family: 'Baloo 2'; font-size: 20px; color: #1B6136">Giỏi lắm! Bầu trời màu xanh.</span>
        </div>
        <a href="#" class="btn btn-sun m-ring" style="align-self: flex-end; min-width: 260px">Trang tiếp <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" stroke="#17324D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      </div>
    </div>
  </div>
</div>


</body>
</html>
