<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Minny hỏi bằng giọng nói</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../design-system/r2l.css">
</head>
<body>



<style>body{margin:0}a{color:#17324D}a:hover{color:#0B1E30}</style>

<div class="r2l" style="width: 390px; min-height: 844px; background: #9BDDFF; padding: 16px; display: flex; flex-direction: column; gap: 14px">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0"><path d="M0 700 C 90 660 200 690 270 670 C 330 655 370 665 390 660 L390 844 L0 844Z" fill="#7BD389"></path><path d="M0 750 C 90 720 200 745 270 730 C 330 718 370 725 390 720 L390 844 L0 844Z" fill="#4FB868"></path></svg>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
    <a href="#" class="back"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6" stroke="#17324D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Về nhà</a>
    <div style="display: flex; align-items: center; gap: 8px">
      <span class="lab">Câu 2 / 4</span>
      <div style="display: flex; gap: 4px"><span class="node n-done" style="width: 16px; height: 16px; border-width: 2px"></span><span class="node" style="width: 16px; height: 16px; border-width: 2px; background: #FFC83D"></span><span class="node n-next" style="width: 16px; height: 16px; border-width: 2px"></span><span class="node n-next" style="width: 16px; height: 16px; border-width: 2px"></span></div>
    </div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <span class="lab">Bước 2 · Trả lời Minny</span>
    <div style="position: relative; width: 168px; height: 168px">
      <div class="node m-halo" style="width: 168px; height: 168px; border: 5px solid #E0362C; background: #9BDDFF"><img src="../assets/minny/minny-face-talk.svg" alt="Minny đang hỏi" style="width: 100%; height: 100%; object-fit: cover"></div>
      <div style="position: absolute; right: -10px; bottom: 6px; display: flex; gap: 4px; align-items: center; background: #FFFFFF; border: 3px solid #17324D; border-radius: 999px; padding: 6px 10px; height: 40px">
        <span class="m-wave" style="width: 5px; height: 20px; border-radius: 3px; background: #E0362C"></span><span class="m-wave" style="width: 5px; height: 20px; border-radius: 3px; background: #E0362C; animation-delay: .2s"></span><span class="m-wave" style="width: 5px; height: 20px; border-radius: 3px; background: #E0362C; animation-delay: .4s"></span>
      </div>
    </div>
  </div>

  <div class="card" style="position: relative; display: flex; flex-direction: column; gap: 6px; text-align: center">
    <span class="lab">Minny đang hỏi:</span>
    <span lang="en" class="d t-2">Why is the little bird happy?</span>
    <button class="btn btn-sm" style="align-self: center; margin-top: 6px; font-size: 18px; min-height: 48px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3CC8F0" stroke="#17324D" stroke-width="2" stroke-linejoin="round"></path><path d="M16 9a4 4 0 0 1 0 6" stroke="#17324D" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>Nghe lại câu hỏi</button>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px">
    <button class="m-ring" aria-label="Con nói" style="width: 128px; height: 128px; border-radius: 50%; background: #FFC83D; border: 4px solid #17324D; box-shadow: 0 6px 0 #17324D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="60" height="60" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#E0362C" stroke="#17324D" stroke-width="2"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8" stroke="#17324D" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg></button>
    <span class="d t-3">Bấm rồi nói câu trả lời</span>
  </div>

  <div style="position: relative; display: flex; align-items: flex-end; gap: 6px; margin-top: auto">
    <img src="../assets/monsters-mock/mon-happy.png" alt="" style="width: 72px; height: 72px">
    <div class="bubble" style="flex: 1; font-size: 16px; font-family: 'Nunito'; font-weight: 800">Câu 1: <span lang="en" style="font-family: 'Baloo 2'; font-size: 19px; color: #1B6136">Great job!</span> Minny thích câu trả lời của con.</div>
  </div>
</div>


</body>
</html>
