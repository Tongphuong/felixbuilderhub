<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hoàn thành và phần thưởng</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../design-system/r2l.css">
</head>
<body>



<style>body{margin:0}a{color:#17324D}a:hover{color:#0B1E30}</style>

<div class="r2l" style="width: 390px; min-height: 844px; background: #9BDDFF; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px">
  <!-- confetti -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 360px; overflow: hidden">
    <span class="m-fall" style="position: absolute; left: 30px; top: 40px; width: 12px; height: 18px; background: #FF7A3D; border: 2px solid #17324D; border-radius: 3px"></span>
    <span class="m-fall" style="position: absolute; left: 92px; top: 90px; width: 14px; height: 14px; background: #FFC83D; border: 2px solid #17324D; border-radius: 50%; animation-delay: .4s"></span>
    <span class="m-fall" style="position: absolute; left: 150px; top: 20px; width: 10px; height: 18px; background: #237A41; border: 2px solid #17324D; border-radius: 3px; animation-delay: .9s"></span>
    <span class="m-fall" style="position: absolute; left: 250px; top: 60px; width: 12px; height: 12px; background: #E0362C; border: 2px solid #17324D; border-radius: 3px; animation-delay: .2s"></span>
    <span class="m-fall" style="position: absolute; left: 310px; top: 110px; width: 14px; height: 20px; background: #3CC8F0; border: 2px solid #17324D; border-radius: 3px; animation-delay: 1.2s"></span>
    <span class="m-fall" style="position: absolute; left: 352px; top: 30px; width: 12px; height: 12px; background: #FFC83D; border: 2px solid #17324D; border-radius: 50%; animation-delay: .6s"></span>
    <span class="m-fall" style="position: absolute; left: 200px; top: 140px; width: 10px; height: 16px; background: #FF7A3D; border: 2px solid #17324D; border-radius: 3px; animation-delay: 1.5s"></span>
  </div>

  <div style="position: relative; width: 260px; height: 260px; margin-top: 18px; display: flex; align-items: center; justify-content: center">
    <svg class="m-burst" aria-hidden="true" width="260" height="260" viewBox="0 0 260 260" style="position: absolute; left: 0; top: 0"><g fill="#FFE7A8" stroke="#17324D" stroke-width="3" stroke-linejoin="round"><path d="M130 6l18 70 62-38-38 62 70 18-70 18 38 62-62-38-18 70-18-70-62 38 38-62-70-18 70-18-38-62 62 38z"></path></g></svg>
    <img class="m-dance" src="../assets/monsters-mock/mon-wow.png" alt="Bạn đồng hành của Minh đang nhảy múa" style="position: relative; width: 190px; height: 190px">
  </div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
    <h1 class="d t-1 m-pop" style="margin: 0">Con đã đọc xong<br><span lang="en">“The Sky Is Blue!”</span></h1>
  </div>

  <div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%">
    <div class="card m-pop" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px; animation-delay: .5s">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#3CC8F0" stroke="#17324D" stroke-width="1.6" stroke-linejoin="round"></path><path d="M2 9h20M9 3l3 18 3-18" stroke="#17324D" stroke-width="1.2" fill="none"></path></svg>
      <span class="d" style="font-size: 40px">+35</span><span style="font-weight: 900">kim cương</span>
    </div>
    <div class="card m-pop" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px; animation-delay: .8s">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC83D" stroke="#17324D" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      <span class="d" style="font-size: 40px">+20</span><span style="font-weight: 900">XP</span>
    </div>
  </div>

  <div class="card-f" style="position: relative; width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; gap: 4px; align-items: center"><span class="node n-done" style="width: 26px; height: 26px; border-width: 2px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"></path></svg></span><span class="node n-done" style="width: 26px; height: 26px; border-width: 2px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"></path></svg></span><span class="node n-done" style="width: 26px; height: 26px; border-width: 2px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"></path></svg></span><span style="font-weight: 900; margin-left: 4px">Về đích!</span></div>
      <span style="font-weight: 900">340 / 400 XP</span>
    </div>
    <div class="bar m-fill"><i style="width: 85%"></i></div>
  </div>

  <div style="position: relative; width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 6px">
    <a href="#" class="btn btn-sun btn-w m-ring">Xong hôm nay</a>
    <a href="#" class="btn btn-w">Đọc thêm truyện</a>
  </div>
</div>


</body>
</html>
