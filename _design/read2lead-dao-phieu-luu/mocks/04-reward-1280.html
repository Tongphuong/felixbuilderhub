<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Phần thưởng — 1280</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../design-system/r2l.css">
</head>
<body>



<style>body{margin:0}a{color:#17324D}a:hover{color:#0B1E30}</style>

<div class="r2l" style="width: 1280px; min-height: 820px; background: #9BDDFF; padding: 40px">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 420px; overflow: hidden">
    <span class="m-fall" style="position: absolute; left: 120px; top: 40px; width: 16px; height: 24px; background: #FF7A3D; border: 2px solid #17324D; border-radius: 3px"></span>
    <span class="m-fall" style="position: absolute; left: 260px; top: 120px; width: 18px; height: 18px; background: #FFC83D; border: 2px solid #17324D; border-radius: 50%; animation-delay: .4s"></span>
    <span class="m-fall" style="position: absolute; left: 420px; top: 30px; width: 14px; height: 22px; background: #237A41; border: 2px solid #17324D; border-radius: 3px; animation-delay: .9s"></span>
    <span class="m-fall" style="position: absolute; left: 820px; top: 70px; width: 16px; height: 16px; background: #E0362C; border: 2px solid #17324D; border-radius: 3px; animation-delay: .2s"></span>
    <span class="m-fall" style="position: absolute; left: 980px; top: 150px; width: 18px; height: 26px; background: #3CC8F0; border: 2px solid #17324D; border-radius: 3px; animation-delay: 1.2s"></span>
    <span class="m-fall" style="position: absolute; left: 1140px; top: 40px; width: 16px; height: 16px; background: #FFC83D; border: 2px solid #17324D; border-radius: 50%; animation-delay: .6s"></span>
  </div>
  <div style="position: relative; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center">
    <div style="position: relative; height: 560px; display: flex; align-items: center; justify-content: center">
      <svg class="m-burst" aria-hidden="true" width="520" height="520" viewBox="0 0 260 260" style="position: absolute"><path d="M130 6l18 70 62-38-38 62 70 18-70 18 38 62-62-38-18 70-18-70-62 38 38-62-70-18 70-18-38-62 62 38z" fill="#FFE7A8" stroke="#17324D" stroke-width="2" stroke-linejoin="round"></path></svg>
      <img class="m-dance" src="../assets/monsters-mock/mon-wow.png" alt="Bạn đồng hành của Minh đang nhảy múa" style="position: relative; width: 320px; height: 320px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px">
      <h1 class="d m-pop" style="margin: 0; font-size: 52px">Con đã đọc xong <span lang="en">“The Sky Is Blue!”</span></h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <div class="card m-pop" style="display: flex; align-items: center; gap: 14px; animation-delay: .5s"><svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#3CC8F0" stroke="#17324D" stroke-width="1.6" stroke-linejoin="round"></path><path d="M2 9h20M9 3l3 18 3-18" stroke="#17324D" stroke-width="1.2" fill="none"></path></svg><div style="display: flex; flex-direction: column"><span class="d" style="font-size: 48px">+35</span><b>kim cương</b></div></div>
        <div class="card m-pop" style="display: flex; align-items: center; gap: 14px; animation-delay: .8s"><svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC83D" stroke="#17324D" stroke-width="1.6" stroke-linejoin="round"></path></svg><div style="display: flex; flex-direction: column"><span class="d" style="font-size: 48px">+20</span><b>XP</b></div></div>
      </div>
      <div class="card-f" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between"><b>Về đích! Cả 3 bước đã xong</b><b>340 / 400 XP</b></div>
        <div class="bar m-fill"><i style="width: 85%"></i></div>
      </div>
      <div style="display: flex; gap: 16px">
        <a href="#" class="btn btn-sun m-ring" style="flex: 1">Xong hôm nay</a>
        <a href="#" class="btn" style="flex: 1">Đọc thêm truyện</a>
      </div>
    </div>
  </div>
</div>


</body>
</html>
